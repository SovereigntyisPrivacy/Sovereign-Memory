name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Sign APK Manually
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.jks
          
          # Find whatever modern build-tools version GitHub has pre-installed
          BUILD_TOOLS_PATH=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort | tail -n 1)
          echo "Using build tools from: $BUILD_TOOLS_PATH"
          
          # Align and Sign using native tools
          $BUILD_TOOLS_PATH/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/app-release-aligned.apk
          
          $BUILD_TOOLS_PATH/apksigner sign --ks android/keystore.jks \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            android/app/build/outputs/apk/release/app-release-aligned.apk
            
          cp android/app/build/outputs/apk/release/app-release-aligned.apk android/app/build/outputs/apk/release/SovereignMemory-Signed.apk

      - name: Upload Signed Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SovereignMemory-Updateable-APK
          path: android/app/build/outputs/apk/release/SovereignMemory-Signed.apk
